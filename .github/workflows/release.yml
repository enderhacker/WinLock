name: Publish WinLock

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: winlock-publish-main
  cancel-in-progress: false

jobs:
  plan:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.plan.outputs.version }}
      commit: ${{ steps.plan.outputs.commit }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
          persist-credentials: false
      - name: Check for a new version on main
        id: plan
        shell: bash
        run: |
          version=$(python3 -m scripts.release pending-version)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  build:
    needs: plan
    if: needs.plan.outputs.version != ''
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.plan.outputs.commit }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.14.7'
          architecture: x64
          cache: pip
          cache-dependency-path: requirements-build.txt
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Build Windows executable
        run: |
          python -m pip install -r requirements-build.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:WINLOCK_PYTHON = (Get-Command python).Source
          .\compilenew.cmd
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: winlock-windows-x64
          path: dist/WinLock.exe
          if-no-files-found: error

  publish:
    needs: [plan, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: winlock-windows-x64
          path: dist
      - name: Commit the executable and manifest to main
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.plan.outputs.version }}
          BUILD_COMMIT: ${{ needs.plan.outputs.commit }}
        run: |
          if [[ "$(git rev-parse HEAD)" != "$BUILD_COMMIT" ]]; then
            echo "main advanced during the build; its workflow run will recheck publication."
            exit 0
          fi

          python3 -m scripts.release prepare "$RELEASE_VERSION" "$GITHUB_REPOSITORY"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- version.json "downloads/$RELEASE_VERSION/WinLock.exe"
          git commit -m "Publish WinLock $RELEASE_VERSION"
          git push origin HEAD:refs/heads/main
