name: Publish WinLock

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

env:
  RELEASE_TAG: ${{ github.ref_name }}

jobs:
  build:
    if: ${{ !github.event.deleted }}
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.14.7'
          architecture: x64
          cache: pip
          cache-dependency-path: requirements-build.txt
      - name: Verify versions and run tests
        run: |
          python -m scripts.release check-source $env:RELEASE_TAG
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s tests -v
      - name: Build Windows executable
        run: |
          python -m pip install -r requirements-build.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:WINLOCK_PYTHON = (Get-Command python).Source
          .\compilenew.cmd
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: winlock-windows-x64
          path: dist/WinLock.exe
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: winlock-publish
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: winlock-windows-x64
          path: dist
      - name: Publish release and update the manifest
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          tag_commit=$(git rev-parse "refs/tags/${RELEASE_TAG}^{commit}")
          if [[ "$tag_commit" != "$(git rev-parse "${RELEASE_SHA}^{commit}")" ]] ||
             ! git merge-base --is-ancestor "$tag_commit" HEAD; then
            echo "::error::Release tag must point to the triggering commit on main."
            exit 1
          fi

          latest=$(gh release view --json tagName --jq .tagName)
          python3 -m scripts.release check-order "$RELEASE_TAG" "$latest"

          if ! draft=$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft); then
            gh release create "$RELEASE_TAG" --verify-tag --draft --title "WinLock $RELEASE_TAG" --generate-notes
            draft=true
          fi
          if [[ "$draft" == true ]]; then
            gh release upload "$RELEASE_TAG" dist/WinLock.exe --clobber
            gh release edit "$RELEASE_TAG" --verify-tag --draft=false --prerelease=false --latest
          fi

          gh api "repos/$GH_REPO/releases/tags/$RELEASE_TAG" |
            python3 -m scripts.release write-manifest "$RELEASE_TAG"
          if ! git diff --quiet -- version.json; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add -- version.json
            git commit -m "Update release manifest for $RELEASE_TAG"
            git push origin HEAD:refs/heads/main
          fi
